name: Windows build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run package:portable
      - uses: actions/upload-artifact@v4
        with:
          name: Magic-Keyframe-Windows
          path: release/*.zip
      - name: Prepare release downloads
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-downloads -Force | Out-Null
          $zip = Get-ChildItem release/Magic-Keyframe-Portable-*.zip | Select-Object -First 1
          if (-not $zip) { throw "Portable ZIP was not produced" }
          Copy-Item $zip.FullName release-downloads/Magic-Keyframe-Windows-Portable.zip
          $hash = (Get-FileHash release-downloads/Magic-Keyframe-Windows-Portable.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Magic-Keyframe-Windows-Portable.zip" | Set-Content release-downloads/SHA256SUMS.txt -Encoding ascii
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-downloads/Magic-Keyframe-Windows-Portable.zip
            release-downloads/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## Windows portable download
            Download **Magic-Keyframe-Windows-Portable.zip** below (not GitHub's source-code ZIP).
            Extract the entire ZIP into a new folder, then double-click **Magic Keyframe.exe**.
            No Git, Node.js, PowerShell, or installation required. Keep the accompanying resources folder.

            To update, close the old version and extract the new ZIP into a separate folder.
            Open your existing .mkproj file using File → Open project. Projects reference your original media; keep that footage.
            Use File → Associate .mkproj files with this app to register this portable location; Windows may still require Open with → Always.

            ## Bounded export and progress (0.6.0)
            - Export settings dialog: resolution, FPS, quality, bitrate ceiling, encoder, audio bitrate and resource mode.
            - Live stage percentage, elapsed/estimated remaining time, encoder status heartbeat and Cancel.
            - Sequential short render pieces instead of a whole-timeline multi-branch decoder graph.
            - Limited decode/filter/encode threads, below-normal process priority, paused preview/proxies during export.
            - Lossless intermediate audio; AAC encoded once at finalization. Extra temporary disk space required.
            - Conservative limits do not guarantee peak resource use on every machine; runtime validation remains necessary.

            ## Optional proxies and overlap transitions (0.5.1)
            - One-second decoder look-ahead prepares the next clip without generating a full-file proxy.
            - Original-media preview by default; optional Use proxies toggle in the preview toolbar.
            - Proxy generation percentage/progress bar and per-file ETA; turning off cancels pending encodes.
            - Direct playback depends on browser codec support; 10-bit 4:2:2 may still need proxies.
            - Drag adjacent same-track clips into an edge overlap: video cross-dissolve and equal-power audio crossfade.
            - Linked moves preserve offsets. Two-way overlaps only; split outside transition boundaries.
            - All clips stop at zero; legacy negative pre-roll shifts the complete timeline right without changing sync.
            - Timeline extent expands during dragging. Saving writes v4; use Save As to keep older files.

            ## Playback and Windows workflow fixes (0.4.2)
            - Contiguous same-source splits avoid needless seeks; pause/resume no longer seeks by itself.
            - Graded preview holds the last decoded frame while seeking/buffering instead of clearing black.
            - New lightweight 720p short-GOP proxies (one-time rebuild; originals/export unchanged).
            - Frame buttons now step the playhead; Alt+left/right nudges selected/linked clips.
            - File menu can register .mkproj files for this portable location; About shows running version/path.
            - Project-load progress, filename-specific errors and Windows text BOM support.
            - Specific legacy-project failures still need the failing .mkproj/error for diagnosis.

            ## Direct timeline video fades
            - Gold triangles at the top of video clips: drag inward for fade-from/to-black, outward to remove.
            - Duration readout while dragging; zoom in for precise adjustments.
            - Applies immediately, saves with the project, and makes one undo step per drag.
            - Does not move clips, the playhead, or change linked audio fades.

            ## Studio workflow
            - Multiple camera/recorder/music sources, with up to 16 video and 16 audio tracks.
            - Media / Effects tabs; per-clip gain, audio fades, speech EQ/compression and spectral noise reduction.
            - Basic SDR exposure, contrast, saturation and warmth; fades from/to black.
            - Assisted waveform sync with confidence, 8-second audition and explicit acceptance.
            - Autosave recovery copies (5-second idle / 30-second periodic, retaining 10 versions per project).
            - 4K / 1080p delivery, both 8-bit H.264/AAC Rec.709 MP4.

            Existing v1/v2/v3 projects open. Saving writes v4; use Save As to retain an old-format copy.
            Select a clip and open Effects; draft settings must be applied before they are saved/exported.
            Imports append on track 1; + on a media item adds a copy at the playhead, using a free new track if needed.
            Add tracks with +V / +A; assign clips through the Effects track selector.
            Noise cleanup is conventional DSP, not AI voice isolation. No drift correction, HDR/Log conversion or three-way/nested transitions.
            Compilation and package checks are not runtime verification of the new editing/audio/render features.
            This is an unsigned early test build. Native Windows interaction/media behavior still needs hands-on checking.
      - name: Mark successful Windows build
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "built-${GITHUB_REF_NAME}"
          git push origin "built-${GITHUB_REF_NAME}"
